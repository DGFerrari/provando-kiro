<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logros — Xbox Style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="xbox-logo" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="3" />
        <path d="M24 6c5 4 11 12 14 18-4 6-9 12-14 18-5-6-10-12-14-18C13 18 19 10 24 6z"
              fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" />
      </svg>
      <div class="brand-text">
        <h1>Mis Logros</h1>
        <p class="subtitle">Visualizador estilo Xbox</p>
      </div>
    </div>

    <div class="gamerscore">
      <span class="gs-icon">G</span>
      <span id="gamerscore-value">0</span>
      <span class="gs-label">Gamerscore</span>
    </div>
  </header>

  <section class="summary">
    <div class="summary-card">
      <span class="summary-number" id="unlocked-count">0</span>
      <span class="summary-label">Desbloqueados</span>
    </div>
    <div class="summary-card">
      <span class="summary-number" id="total-count">0</span>
      <span class="summary-label">Totales</span>
    </div>
    <div class="summary-card progress-card">
      <div class="progress-head">
        <span class="summary-label">Progreso</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
  </section>

  <nav class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">Todos</button>
    <button class="filter-btn" data-filter="unlocked">Desbloqueados</button>
    <button class="filter-btn" data-filter="locked">Bloqueados</button>
  </nav>

  <main class="achievements" id="achievements"></main>

  <footer class="footer">
    <p>Hecho con Kiro · Datos editables en <code>achievements.js</code> · Clic en un logro para bloquear/desbloquear</p>
  </footer>

  <!-- Contenedor de notificaciones estilo Xbox -->
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <script src="achievements.js"></script>
  <script src="app.js"></script>
</body>
</html>
